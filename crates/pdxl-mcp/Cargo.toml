[package]
name = "pdxl-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "MCP server exposing pdxl's CK3 script documentation and scope-aware built-in metadata to agents"
# Standalone server binary, not in the pdxl-cli tree and depended on by nothing;
# shipped as a binary rather than a crates.io library.
publish = false

[features]
default = []
mcp = ["dep:rmcp", "dep:tokio"]

[[bin]]
name = "pdxl-mcp"
path = "src/main.rs"
required-features = ["mcp"]

[dependencies]
pdxl-ck3.workspace = true
rmcp = { workspace = true, optional = true }
schemars.workspace = true
serde.workspace = true
tokio = { workspace = true, optional = true }
