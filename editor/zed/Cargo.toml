[package]
name = "pdxl-zed"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

# Compiled to WebAssembly by Zed; deliberately NOT a member of the rust/
# workspace (that targets the host, this targets wasm32-wasip2).
[lib]
crate-type = ["cdylib"]

[dependencies]
zed_extension_api = "0.7"
