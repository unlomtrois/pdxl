id = "pdxl"
name = "pdxl PDXScript"
version = "0.1.0"
schema_version = 1
authors = ["unlomtrois <vadim.kuz02@gmail.com>"]
description = "Paradox/CK3 PDXScript language support via the pdxl language server"
repository = "https://github.com/unlomtrois/pdxl"

# Syntax highlighting grammar. Zed compiles the pinned revision to WASM on
# install; the language config in languages/pdxscript references it by name.
[grammars.paradox]
repository = "https://github.com/acture/tree-sitter-paradox"
rev = "a34cc7afc06a870a2b6a7d6d1666a519d0508e8b" # tag v0.2.0

# The pdxl language server, launched by src/lib.rs. `languages` must match the
# `name` in languages/pdxscript/config.toml.
[language_servers.pdxl]
name = "pdxl"
languages = ["PDXScript"]
