name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Validate tag and Cargo version
        id: version
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must have the form vX.Y.Z" >&2
            exit 1
          fi
          tag_version="${GITHUB_REF_NAME#v}"
          # All crates inherit the workspace version; read it off the binary crate.
          cargo_version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "pdxl-cli") | .version')"
          if [[ "$tag_version" != "$cargo_version" ]]; then
            echo "Tag $tag_version does not match workspace version $cargo_version" >&2
            exit 1
          fi
          echo "version=$tag_version" >> "$GITHUB_OUTPUT"

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets --features pdxl-cli/ck3,pdxl-mcp/ck3 -- -D warnings

      - name: Run tests
        run: cargo test --locked --workspace --features pdxl-cli/ck3,pdxl-mcp/ck3

  build:
    name: Build ${{ matrix.target }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bin: pdxl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bin: pdxl
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            bin: pdxl
          - runner: macos-15
            target: aarch64-apple-darwin
            bin: pdxl
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            bin: pdxl.exe
            windows: true
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Several goldens embed filesystem paths (separators, case), so the suite
      # is not yet Windows-clean; it runs on Linux (CI + here) and macOS. The
      # Windows job builds the binary — a cargo build is the meaningful
      # per-platform check that the code compiles for the MSVC target.
      - name: Test
        if: ${{ !matrix.windows }}
        run: cargo test --locked --workspace --features pdxl-cli/ck3,pdxl-mcp/ck3

      # One binary per game (the schema is compiled in — see pdxl-game).
      # `pdxl-v*` stays the CK3 binary so pre-0.61 extensions keep resolving;
      # the EU5 binary ships as `pdxl-eu5-v*`.
      - name: Build and package (ck3)
        shell: bash
        run: |
          cargo build --locked --release -p pdxl-cli --features ck3
          archive="pdxl-v${{ needs.validate.outputs.version }}-${{ matrix.target }}.tar.gz"
          tar -C target/release -czf "$archive" "${{ matrix.bin }}"
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "$archive" > "$archive.sha256"
          else
            sha256sum "$archive" > "$archive.sha256"
          fi

      - name: Build and package (eu5)
        shell: bash
        run: |
          cargo build --locked --release -p pdxl-cli --features eu5
          archive="pdxl-eu5-v${{ needs.validate.outputs.version }}-${{ matrix.target }}.tar.gz"
          tar -C target/release -czf "$archive" "${{ matrix.bin }}"
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "$archive" > "$archive.sha256"
          else
            sha256sum "$archive" > "$archive.sha256"
          fi

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: pdxl-${{ matrix.target }}
          path: |
            pdxl-v${{ needs.validate.outputs.version }}-${{ matrix.target }}.tar.gz
            pdxl-v${{ needs.validate.outputs.version }}-${{ matrix.target }}.tar.gz.sha256
            pdxl-eu5-v${{ needs.validate.outputs.version }}-${{ matrix.target }}.tar.gz
            pdxl-eu5-v${{ needs.validate.outputs.version }}-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error

  vsix:
    name: Package VS Code extension
    needs: validate
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: editor/vscode
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editor/vscode/package-lock.json

      - name: Install dependencies
        run: npm ci

      # `vsix` runs vscode:prepublish (tsc type-check + production esbuild).
      # Not published to the Marketplace — only attached to the GitHub Release.
      - name: Package extension
        run: npm run vsix

      # Named `pdxl-*` so github-release's `pattern: pdxl-*` download picks it
      # up and merges the .vsix into `dist/` alongside the binaries.
      - name: Upload .vsix artifact
        uses: actions/upload-artifact@v7
        with:
          name: pdxl-vscode-extension
          path: editor/vscode/*.vsix
          if-no-files-found: error

  github-release:
    name: Create GitHub Release
    needs: [validate, build, vsix]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download release artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: pdxl-*
          path: dist
          merge-multiple: true

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --generate-notes \
              --title "$GITHUB_REF_NAME" \
              --verify-tag
          fi
