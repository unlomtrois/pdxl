[workspace]
resolver = "2"
members = [
    # foundation
    "crates/pdxl-src",      # TextRange: zero-based, half-open byte ranges
    "crates/pdxl-path",     # Go-compatible lexical path helpers
    # syntax pipeline
    "crates/pdxl-lexer",    # byte-offset tokenizer
    "crates/pdxl-ast",      # flat node-pool syntax tree (data only)
    "crates/pdxl-parser",   # recursive-descent parser producing pdxl-ast trees
    # project model
    "crates/pdxl-fileset",  # directory scanning + mod-overlay resolution
    "crates/pdxl-moddesc",  # .mod descriptor parsing
    "crates/pdxl-cache",    # two-level parse cache (in-memory LRU + disk)
    # semantic analysis
    "crates/pdxl-analysis", # per-file fact extraction (game-agnostic engine)
    "crates/pdxl-ck3",      # CK3 schema rows + generated doc tables + structural contexts
    "crates/pdxl-gui",      # interface-script (.gui) dialect parsing + template/type symbols
    "crates/pdxl-yml",      # Paradox localization .yml parser
    "crates/pdxl-project",  # whole-project analysis + incremental updates
    # user-facing
    "crates/pdxl-fmt",      # PDXScript formatter (token+trivia based, comment-preserving)
    "crates/pdxl-cli",      # the pdxl binary: lex / parse / check / fmt / lsp
    "crates/pdxl-lsp",      # the language server (M8a: sync, diagnostics, definition)
    "crates/pdxl-mcp",      # MCP server for agent-facing semantic queries
    # dev tooling
    "crates/pdxl-gamedocs", # parses the game's doc dumps; gen-tables renders pdxl-ck3 tables
    "crates/pdxl-eu5",      # the EU5 schema (starter): kinds, entities, contexts
    "crates/pdxl-game",     # compile-time game facade (feature ck3 XOR eu5)
    # test infrastructure
    "crates/pdxl-testutil", # shared test helpers (temp trees, repo root)
]

# Full debuginfo dominated a multi-GiB target/; line tables keep file:line in
# backtraces, which is all this project uses. Flip back temporarily for gdb.
[profile.dev]
debug = "line-tables-only"

[workspace.package]
# Bumped on each new feature; tracks ANALYSIS_VERSION (0.<N>.0).
version = "0.120.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/unlomtrois/pdxl"
rust-version = "1.96"

[workspace.dependencies]
pdxl-src = { path = "crates/pdxl-src" }
pdxl-path = { path = "crates/pdxl-path" }
pdxl-lexer = { path = "crates/pdxl-lexer" }
pdxl-ast = { path = "crates/pdxl-ast" }
pdxl-parser = { path = "crates/pdxl-parser" }
pdxl-fileset = { path = "crates/pdxl-fileset" }
pdxl-moddesc = { path = "crates/pdxl-moddesc" }
pdxl-cache = { path = "crates/pdxl-cache" }
pdxl-analysis = { path = "crates/pdxl-analysis" }
pdxl-fmt = { path = "crates/pdxl-fmt" }
pdxl-yml = { path = "crates/pdxl-yml" }
pdxl-ck3 = { path = "crates/pdxl-ck3" }
pdxl-gui = { path = "crates/pdxl-gui" }
pdxl-gamedocs = { path = "crates/pdxl-gamedocs" }
pdxl-eu5 = { path = "crates/pdxl-eu5" }
pdxl-game = { path = "crates/pdxl-game" }
pdxl-project = { path = "crates/pdxl-project" }
pdxl-lsp = { path = "crates/pdxl-lsp" }
pdxl-testutil = { path = "crates/pdxl-testutil" }

# external — added for the syntax cache (M4); versions pinned at the workspace
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", default-features = false, features = ["alloc"] }
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
# external — added for the LSP (M8a)
lsp-server = "0.7"
lsp-types = "0.95"
serde_json = "1"
crossbeam-channel = "0.5"
# external — data-parallel project build (prototype)
rayon = "1"
# external — official Model Context Protocol SDK
rmcp = { version = "0.16", features = ["server", "transport-io"] }
schemars = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }
