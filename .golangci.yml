version: "2"

linters:
  enable:
    - revive
    - nestif
  settings:
    nestif:
      min-complexity: 4
    errcheck:
      exclude-functions:
        - (*os.File).Close
        - (io.ReadCloser).Close
    revive:
      rules:
        - name: var-naming
          disabled: true
        - name: cognitive-complexity
          arguments: [20]
  exclusions:
    rules:
      # Table-driven golden tests are naturally branchy; complexity there is noise.
      - path: _test\.go
        text: cognitive-complexity