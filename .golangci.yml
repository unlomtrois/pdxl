version: "2"

linters:
  # 1. Enable linters directly in the linters block
  enable:
    - revive
    - prealloc    # Essential: finds non-preallocated slices
    - perfsprint  # Essential: replaces heavy fmt.Sprintf with strconv
    - gocritic    # Performance checks like hugeParam (copying large structs)
    - unconvert   # Removes redundant type conversions
    - staticcheck # Industry standard for performance & bugs

  # 2. Settings are now nested directly inside the linters block in v2
  settings:
    revive:
      # disable-all-rules: true # Use this if you only want specific rules
      rules:
        - name: var-naming
          disabled: true
    
    errcheck:
      exclude-functions:
        - (*os.File).Close
        - (io.ReadCloser).Close

    gocritic:
      enabled-checks:
        - hugeParam     # Passing large structs by value
        - rangeValCopy  # Large value copies in loops
        - stringXbytes  # Inefficient string/byte conversions
    
    prealloc:
      simple: true
      range-loops: true

# 3. Global exclusions for rules that still leak through (like staticcheck's naming)
issues:
  exclude-rules:
    - linters:
        - staticcheck
      text: "ST1003" # Silences staticcheck's version of var-naming
