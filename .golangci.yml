version: "2"

linters:
  enable:
    - revive
    - prealloc    # Essential for slice capacity optimization
    - perfsprint  # Avoids expensive fmt.Sprintf allocations
    - gocritic    # Catches large struct copies and string conversions
    - unconvert   # Removes redundant, allocating conversions
    - staticcheck # General performance checks

linters-settings:
  revive:
    rules:
      - name: var-naming
        disabled: true
        
  errcheck:
    exclude-functions:
      - (*os.File).Close
      - (io.ReadCloser).Close

  # Specific settings to target memory efficiency
  gocritic:
    enabled-checks:
      - hugeParam      # Flags large structs passed by value (copies)
      - rangeValCopy   # Flags large values copied in for-range loops
      - stringXbytes   # Flags inefficient string/byte conversions
      - appendCombine  # Merges multiple appends into one allocation
  
  prealloc:
    simple: true
    range-loops: true
    for-loops: true

  perfsprint:
    # Optimizes fmt.Sprintf to strconv where possible
    int-conversion: true
    err-error: true
    error-f: true
    sprintf1: true
    strconcat: true
