[package]
name = "pdxl-parity"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Go-oracle differential harness: canonical dump formats, dump binaries, and parity tests."
publish = false

[dependencies]
pdxl-src.workspace = true
pdxl-lexer.workspace = true
pdxl-ast.workspace = true
pdxl-parser.workspace = true
pdxl-path.workspace = true
pdxl-fileset.workspace = true
pdxl-moddesc.workspace = true

[dev-dependencies]
pdxl-testutil.workspace = true

[lints.rust]
unsafe_code = "forbid"

[[bin]]
name = "lexdump"
path = "src/bin/lexdump.rs"

[[bin]]
name = "parsedump"
path = "src/bin/parsedump.rs"

[[bin]]
name = "filesetdump"
path = "src/bin/filesetdump.rs"
