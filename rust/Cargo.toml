[workspace]
resolver = "2"
members = [
    # foundation
    "crates/pdxl-src",      # TextRange: zero-based, half-open byte ranges
    "crates/pdxl-path",     # Go-compatible lexical path helpers
    # syntax pipeline
    "crates/pdxl-lexer",    # byte-offset tokenizer
    "crates/pdxl-ast",      # flat node-pool syntax tree (data only)
    "crates/pdxl-parser",   # recursive-descent parser producing pdxl-ast trees
    # project model
    "crates/pdxl-fileset",  # directory scanning + mod-overlay resolution
    "crates/pdxl-moddesc",  # .mod descriptor parsing
    "crates/pdxl-cache",    # two-level parse cache (in-memory LRU + disk)
    # semantic analysis
    "crates/pdxl-analysis", # per-file fact extraction (game-agnostic engine)
    "crates/pdxl-ck3",      # CK3 schema: def dirs, ref keys, skip lists
    "crates/pdxl-project",  # whole-project analysis + incremental updates
    # user-facing
    "crates/pdxl-cli",      # the pdxl binary: lex / parse / check
    # test / parity infrastructure
    "crates/pdxl-testutil", # shared test helpers (temp trees, repo root)
    "crates/pdxl-parity",   # dump formats, dump binaries, Go differential tests
]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/unlomtrois/pdxl"
rust-version = "1.96"

[workspace.dependencies]
pdxl-src = { path = "crates/pdxl-src" }
pdxl-path = { path = "crates/pdxl-path" }
pdxl-lexer = { path = "crates/pdxl-lexer" }
pdxl-ast = { path = "crates/pdxl-ast" }
pdxl-parser = { path = "crates/pdxl-parser" }
pdxl-fileset = { path = "crates/pdxl-fileset" }
pdxl-moddesc = { path = "crates/pdxl-moddesc" }
pdxl-cache = { path = "crates/pdxl-cache" }
pdxl-analysis = { path = "crates/pdxl-analysis" }
pdxl-ck3 = { path = "crates/pdxl-ck3" }
pdxl-project = { path = "crates/pdxl-project" }
pdxl-testutil = { path = "crates/pdxl-testutil" }

# external — added for the syntax cache (M4); versions pinned at the workspace
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", default-features = false, features = ["alloc"] }
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
